<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 순위 체크 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- 헤더 영역 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">SEO 네이버 순위 체크 대시보드</h1>
                <p class="text-sm text-gray-500 mt-1">타겟 키워드에 대한 웹사이트 순위를 추적합니다.</p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-3">
                <button id="updateAllBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    전체 업데이트
                </button>
            </div>
        </header>

        <!-- 아이템 추가 폼 -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">새 키워드 등록</h2>
            <form id="addForm" class="flex flex-col md:flex-row gap-4">
                <input type="text" id="siteUrl" placeholder="사이트 URL (예: cukiz.co.kr)" required class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="targetKeyword" placeholder="타겟 키워드 (예: 수제쿠키)" required class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-sm">등록하기</button>
            </form>
        </div>

        <!-- 결과 테이블 -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">사이트 URL</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">키워드</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">현재 순위</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">전일 대비</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">최근 7일 추이</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">관리</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="bg-white divide-y divide-gray-200">
                        <!-- JS에서 데이터가 동적으로 렌더링 됩니다. -->
                    </tbody>
                </table>
            </div>
            <!-- 로딩 표시창 (전체 업데이트 시) -->
            <div id="loadingOverlay" class="hidden absolute inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center z-10">
                <div class="loader border-4 border-gray-200 rounded-full w-12 h-12 mb-4"></div>
                <p class="text-gray-700 font-medium" id="loadingText">전체 순위를 업데이트 중입니다... (IP 차단 방지를 위해 천천히 진행됩니다)</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
